# Mandi ERP — nginx location blocks for a sub-path deploy at
#   https://nexussoftlab.com/mandi
#
# Add these TWO location blocks inside your existing `server { ... }` block for
# nexussoftlab.com (the one that already terminates TLS on 443). They sit
# alongside your other apps — nothing else in that server block changes.
#
# Architecture:
#   /mandi/api/*  ->  NestJS API (127.0.0.1:3002, global prefix /api)
#   /mandi/*      ->  built React SPA served as static files from /var/www/mandi

# --- API: proxy to the NestJS process on port 3002 ---
location /mandi/api/ {
    # Trailing slash on both sides strips "/mandi" and forwards "/api/...".
    proxy_pass http://127.0.0.1:3002/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow base64 image uploads (login/wallpaper) and backup restore payloads.
    client_max_body_size 12m;
    proxy_read_timeout 120s;
}

# --- Frontend: static SPA with client-side routing fallback ---
location /mandi/ {
    alias /var/www/mandi/;
    try_files $uri $uri/ /mandi/index.html;
}

# Long-cache the fingerprinted build assets (filenames change on each build).
location /mandi/assets/ {
    alias /var/www/mandi/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
